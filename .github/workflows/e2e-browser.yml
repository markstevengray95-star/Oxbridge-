name: Browser E2E

on:
  pull_request:
  push:
    branches: [main, production/e2e-rate-limit, production/ci-auth-e2e]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Generate localhost-only E2E credentials
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "E2E_TEST_MODE=1" >> "$GITHUB_ENV"
          echo "E2E_TEST_USERNAME=ci-e2e" >> "$GITHUB_ENV"
          echo "E2E_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: npm install --legacy-peer-deps

      - name: Install pinned Playwright runner
        run: npm install --no-save --legacy-peer-deps @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Run browser journeys
        run: npx playwright test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
