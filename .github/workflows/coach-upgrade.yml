name: Apply integrated coach upgrade
on:
  push:
    branches: [feat/ideal-oxbridge-coach]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ideal-oxbridge-coach
      - name: Integrate coach features
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing {label}')
              s=s.replace(old,new,1)

          rep('import { dailyChallenges, interviewDayStages, interviewProfileFor, mentorAssignmentTemplates, mistakeRemedies, officialPreparationSources, teachingLessonFor } from "@/lib/prep-suite"',
              'import { dailyChallenges, interviewDayStages, interviewProfileFor, mentorAssignmentTemplates, mistakeRemedies, officialPreparationSources, teachingLessonFor } from "@/lib/prep-suite"\nimport { buildCoachPlan, coachMilestones, confidenceCalibration, interviewRoutingNotes, interviewerPersonas, milestoneStatus, mutationPrompts, officialResourceLibrary, testStrategies, warmUps, weakAnswerClinic, type InterviewMode, type InterviewPersonaKey } from "@/lib/coach-suite"', 'coach import')

          rep('type MentorAssignment = { id: string; title: string; done: boolean }\ntype AccessibilitySettings = { largeText: boolean; highContrast: boolean; reducedMotion: boolean; readingSupport: boolean }\ntype ProgressState = { sessions: number; interviewScores: number[]; testCorrect: number; testAttempted: number; streak: number; completed: string[]; mistakes: Record<string, number>; logs: SessionLog[]; activities: Activity[]; weeklyDone: number[]; wrongQuestionIds: string[]; bookmarkedQuestionIds: string[]; sectionScores: Record<string, SectionScore>; reattemptDue: Record<string, number>; testTimings: TestTiming[]; mentorAssignments: MentorAssignment[] }\nconst emptyProgress: ProgressState = { sessions: 0, interviewScores: [], testCorrect: 0, testAttempted: 0, streak: 0, completed: [], mistakes: {}, logs: [], activities: [], weeklyDone: [], wrongQuestionIds: [], bookmarkedQuestionIds: [], sectionScores: {}, reattemptDue: {}, testTimings: [], mentorAssignments: [] }',
              'type MentorAssignment = { id: string; title: string; done: boolean }\ntype ConfidenceLog = { score: number; confidence: number; note: string; date: string }\ntype HardQuestionNote = { id: string; reason: string; lesson: string; updated: string }\ntype ResearchProject = { question: string; evidence: string; counter: string; next: string }\ntype PrivacySettings = { saveTranscripts: boolean; parentSummary: boolean; localOnly: boolean }\ntype InterviewPack = { id: string; title: string; prompts: string[] }\ntype AccessibilitySettings = { largeText: boolean; highContrast: boolean; reducedMotion: boolean; readingSupport: boolean }\ntype ProgressState = { sessions: number; interviewScores: number[]; testCorrect: number; testAttempted: number; streak: number; completed: string[]; mistakes: Record<string, number>; logs: SessionLog[]; activities: Activity[]; weeklyDone: number[]; wrongQuestionIds: string[]; bookmarkedQuestionIds: string[]; sectionScores: Record<string, SectionScore>; reattemptDue: Record<string, number>; testTimings: TestTiming[]; mentorAssignments: MentorAssignment[]; confidenceLogs: ConfidenceLog[]; hardQuestionNotes: HardQuestionNote[]; misconceptions: Record<string, number>; researchProject: ResearchProject; privacy: PrivacySettings; interviewPacks: InterviewPack[]; fullPapersCompleted: number; peerMocks: number }\nconst emptyProgress: ProgressState = { sessions: 0, interviewScores: [], testCorrect: 0, testAttempted: 0, streak: 0, completed: [], mistakes: {}, logs: [], activities: [], weeklyDone: [], wrongQuestionIds: [], bookmarkedQuestionIds: [], sectionScores: {}, reattemptDue: {}, testTimings: [], mentorAssignments: [], confidenceLogs: [], hardQuestionNotes: [], misconceptions: {}, researchProject: { question: "", evidence: "", counter: "", next: "" }, privacy: { saveTranscripts: true, parentSummary: false, localOnly: true }, interviewPacks: [], fullPapersCompleted: 0, peerMocks: 0 }', 'progress types')

          rep('useEffect(() => { if (!loaded) return; localStorage.setItem("oxbridge-tutor-progress-v2", JSON.stringify(progress)); localStorage.setItem("oxbridge-tutor-profile-v2", JSON.stringify({ university, track, course, year })); localStorage.setItem("oxbridge-tutor-accessibility-v1", JSON.stringify(accessibility)) }, [progress, university, track, course, year, accessibility, loaded])',
              'useEffect(() => { if (!loaded) return; localStorage.setItem("oxbridge-tutor-progress-v2", JSON.stringify(progress)); localStorage.setItem("oxbridge-tutor-profile-v2", JSON.stringify({ university, track, course, year })); localStorage.setItem("oxbridge-tutor-accessibility-v1", JSON.stringify(accessibility)) }, [progress, university, track, course, year, accessibility, loaded])\n  useEffect(() => { if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {}) }, [])', 'pwa register')

          rep('<TabsContent value="interview"><InterviewStudio track={track} course={course} onComplete={completeInterview} /></TabsContent>',
              '<TabsContent value="interview"><InterviewStudio track={track} course={course} progress={progress} setProgress={setProgress} onComplete={completeInterview} /></TabsContent>', 'interview props')
          rep('<AdmissionsTests track={track} progress={progress} accessibility={accessibility}', '<AdmissionsTests track={track} progress={progress} setProgress={setProgress} accessibility={accessibility}', 'test props usage')

          old='const pathway = pathwayFor(university, track), dueNow = Object.values(progress.reattemptDue).filter(ts => ts <= Date.now()).length, nextAction = progress.sessions === 0 ? "Run your interview diagnostic" : progress.testAttempted < 5 ? "Complete your admissions-test diagnostic" : dueNow > 0 ? `Complete ${dueNow} spaced-review question${dueNow === 1 ? "" : "s"}` : "Practise your weakest skill", challenge = dailyChallenges[track][new Date().getDate() % dailyChallenges[track].length]'
          new='const pathway = pathwayFor(university, track), dueNow = Object.values(progress.reattemptDue).filter(ts => ts <= Date.now()).length, topMistake = Object.entries(progress.mistakes).sort((a,b) => b[1]-a[1])[0]?.[0], coachPlan = buildCoachPlan({ sessions: progress.sessions, attempts: progress.testAttempted, accuracy: testAccuracy, overdue: dueNow, topMistake, activities: progress.activities.length, mentorTasks: progress.mentorAssignments.filter(x => !x.done).length }), nextAction = coachPlan[0] ?? "Complete a focused practice session", challenge = dailyChallenges[track][new Date().getDate() % dailyChallenges[track].length], milestones = milestoneStatus({ sessions: progress.sessions, testAttempted: progress.testAttempted, activities: progress.activities.length, completed: progress.completed, wrongQuestionIds: progress.wrongQuestionIds, logs: progress.logs })'
          rep(old,new,'dashboard coach vars')

          rep('<Card className="mt-5 border-[var(--aqua)]/40 bg-[var(--ice)]"><CardContent className="flex flex-col justify-between gap-4 p-5 sm:flex-row sm:items-center"><div><p className="eyebrow">Daily challenge</p><p className="mt-1 font-serif text-xl font-bold">{challenge}</p></div><Button onClick={() => setTab("interview")}>Discuss it <ChevronRight /></Button></CardContent></Card></>',
              '<Card className="mt-5 border-[var(--aqua)]/40 bg-[var(--ice)]"><CardContent className="flex flex-col justify-between gap-4 p-5 sm:flex-row sm:items-center"><div><p className="eyebrow">Daily challenge</p><p className="mt-1 font-serif text-xl font-bold">{challenge}</p></div><Button onClick={() => setTab("interview")}>Discuss it <ChevronRight /></Button></CardContent></Card><section className="mt-5 grid gap-4 xl:grid-cols-2"><Card><CardHeader><p className="eyebrow">Personal weekly coach</p><CardTitle className="font-serif text-2xl">What to do next</CardTitle></CardHeader><CardContent className="space-y-2">{coachPlan.map((item,i) => <div className="prompt-card" key={item}><span>{i+1}</span><p>{item}</p></div>)}</CardContent></Card><Card><CardHeader><p className="eyebrow">Progress milestones</p><CardTitle className="font-serif text-2xl">Preparation journey</CardTitle></CardHeader><CardContent className="space-y-2">{coachMilestones.map((item,i) => <div className="route-row" key={item.id}><p>{item.label}<small className="block text-xs text-muted-foreground">{item.condition}</small></p><Badge variant={milestones[i] ? "default" : "outline"}>{milestones[i] ? "Reached" : "Next"}</Badge></div>)}</CardContent></Card></section></>', 'dashboard plan and milestones')

          rep('function InterviewStudio({ track, course, onComplete }: { track: TrackId; course: string; onComplete: (result: Result, id: string, title: string, events: string[]) => void }) {',
              'function InterviewStudio({ track, course, progress, setProgress, onComplete }: { track: TrackId; course: string; progress: ProgressState; setProgress: React.Dispatch<React.SetStateAction<ProgressState>>; onComplete: (result: Result, id: string, title: string, events: string[]) => void }) {', 'interview signature')

          rep('[listening, setListening] = useState(false), [mockStage, setMockStage] = useState(0), [mockResults, setMockResults] = useState<Result[]>([]), [mockEvents, setMockEvents] = useState<string[]>([])',
              '[listening, setListening] = useState(false), [mockStage, setMockStage] = useState(0), [mockResults, setMockResults] = useState<Result[]>([]), [mockEvents, setMockEvents] = useState<string[]>([]), [formalStarted, setFormalStarted] = useState(false), [personaKey, setPersonaKey] = useState<InterviewPersonaKey>("Socratic"), [interviewMode, setInterviewMode] = useState<InterviewMode>("Realistic"), [confidence, setConfidence] = useState(3), [interruptions, setInterruptions] = useState(true), [peerMode, setPeerMode] = useState(false), [warmupIndex, setWarmupIndex] = useState(0), [visualStimulus, setVisualStimulus] = useState(false)', 'interview states')

          rep('const profile = interviewProfileFor(course, track), stage = interviewDayStages[mockStage]\n  const timer = useTimer(kind === "Mock Day" ? stage.minutes : pressure === "Full Mock" ? 12 : 8), recognitionRef',
              'const profile = interviewProfileFor(course, track), stage = interviewDayStages[mockStage], formalPersona = interviewerPersonas[personaKey], noHints = interviewMode === "No-hint" || pressure === "Full Mock", stressMode = interviewMode === "Stress"\n  const timer = useTimer(kind === "Mock Day" ? stage.minutes : stressMode ? 6 : pressure === "Full Mock" ? 12 : 8), recognitionRef', 'formal persona')

          rep('useEffect(() => { setSkill(pathwayDetails[track].skills[0]); setSeed(0); setAnswer(""); setResult(null); setFollowUp(""); setHintText(""); setHintLevel(0); setTurns([]); setEvents([]); setMockStage(0); setMockResults([]); setMockEvents([]) }, [track, course])',
              'useEffect(() => { setSkill(pathwayDetails[track].skills[0]); setSeed(0); setAnswer(""); setResult(null); setFollowUp(""); setHintText(""); setHintLevel(0); setTurns([]); setEvents([]); setMockStage(0); setMockResults([]); setMockEvents([]); setFormalStarted(false); setConfidence(3) }, [track, course])', 'interview reset')

          rep('const styledChallenge = (challenge: string) => {\n    if (personality === "Supportive tutor") return `Good — keep developing that. ${challenge}`\n    if (personality === "Technical tutor") return `Be precise and make the mechanism explicit. ${challenge}`\n    if (personality === "Critical tutor") return `I am not convinced yet. ${challenge}`\n    return challenge\n  }',
              'const styledChallenge = (challenge: string, text = "") => { const words = text.trim().split(/\\s+/).filter(Boolean).length; if (interruptions && (words > 125 || (stressMode && turns.length % 2 === 0))) return `${formalPersona.interruption}${challenge}`; return `${formalPersona.followupPrefix}${challenge}` }', 'challenge style')
          rep('return styledChallenge(raw)', 'return styledChallenge(raw, text)', 'styled call')

          rep('setTurns(t => [...t, { prompt: activePrompt, answer }]); setFollowUp(challenge); setAnswer(""); setHintText(""); setHintLevel(0); speak(challenge)',
              'setTurns(t => [...t, { prompt: activePrompt, answer }]); setFollowUp(challenge); setAnswer(""); setHintText(""); setHintLevel(0); speak(challenge); if (answer.trim().split(/\\s+/).length < 24 && !noHints) setHintText("Think aloud more explicitly: name what you notice, the step you are taking and why it follows.")', 'think aloud')

          rep('const useHint = () => {\n    const hints =', 'const useHint = () => {\n    if (noHints) return\n    const hints =', 'no hint logic')

          rep('const resetInterviewTurn = () => { setSeed(s => s + 1); setAnswer(""); setResult(null); setFollowUp(""); setHintText(""); setHintLevel(0); setTurns([]); setEvents([]); timer.reset() }',
              'const resetInterviewTurn = () => { setSeed(s => s + 1); setAnswer(""); setResult(null); setFollowUp(""); setHintText(""); setHintLevel(0); setTurns([]); setEvents([]); setFormalStarted(false); timer.reset() }\n  const mutateQuestion = () => { const mutation = mutationPrompts[track][(seed + turns.length) % mutationPrompts[track].length]; setFollowUp(mutation); setEvents(e => [...e, `Question mutated: ${mutation}`]); speak(mutation) }', 'mutation logic')

          rep('const sessionEvents = [...events, ...transcript, `Interview ended after ${finalTurns.length} reasoning turn${finalTurns.length === 1 ? "" : "s"}`, archiveActive ? `Published source: ${publishedItem.sourceTitle}` : "Original practice material"]',
              'const calibration = confidenceCalibration(confidence, scored.total); const sessionEvents = [...events, ...transcript, `Confidence before feedback: ${confidence}/5`, `Calibration: ${calibration}`, `Interview ended after ${finalTurns.length} reasoning turn${finalTurns.length === 1 ? "" : "s"}`, archiveActive ? `Published source: ${publishedItem.sourceTitle}` : "Original practice material"]', 'confidence event')
          rep('setTurns(finalTurns); setResult(scored); timer.setRunning(false)',
              'setTurns(finalTurns); setResult(scored); timer.setRunning(false); speak(formalPersona.closing); setProgress(p => ({ ...p, confidenceLogs: [...p.confidenceLogs, { score: scored.total, confidence, note: calibration, date: new Date().toISOString() }].slice(-100), misconceptions: scored.error === "No dominant error" ? p.misconceptions : { ...p.misconceptions, [scored.error]: (p.misconceptions[scored.error] ?? 0) + 1 }, peerMocks: p.peerMocks + (peerMode ? 1 : 0) }))', 'confidence persist')

          anchor='  const thinkingMoves = [["Assumption", /assum|suppos|given|if /i.test([...turns.map(t => t.answer), answer].join(" "))], ["Example", /example|case|consider|for instance/i.test([...turns.map(t => t.answer), answer].join(" "))], ["Counterpoint", /however|counter|alternative|on the other hand|unless/i.test([...turns.map(t => t.answer), answer].join(" "))], ["Conclusion", /therefore|hence|so I would|conclude|overall/i.test([...turns.map(t => t.answer), answer].join(" "))]] as const\n'
          if anchor not in s: raise SystemExit('missing interview pre-return anchor')
          insert=anchor+'  if (!formalStarted && kind !== "Mock Day") return <><PageIntro eyebrow="Formal interview room" title={`${course} interview practice`} description="Enter a realistic academic interview: no admissions prediction, no scripted perfect answer, and feedback only after you finish unless you deliberately choose Tutor mode." /><section className="grid gap-5 xl:grid-cols-[1.2fr_.8fr]"><Card className="border-[var(--blue)]/20"><CardHeader><div className="flex flex-wrap gap-2"><Badge>Candidate lobby</Badge><Badge variant="outline">{profile.course}</Badge><Badge variant="outline">{formalPersona.label}</Badge></div><CardTitle className="font-serif text-3xl">Prepare to enter the interview.</CardTitle><CardDescription>{formalPersona.opening}</CardDescription></CardHeader><CardContent className="grid gap-4 sm:grid-cols-2"><SelectField label="Practice type" value={kind} onChange={v => setKind(v as typeof kind)} options={["Adaptive", "Unseen"]} /><SelectField label="Interview style" value={interviewMode} onChange={v => setInterviewMode(v as InterviewMode)} options={["Tutor", "Realistic", "No-hint", "Stress"]} /><SelectField label="Interviewer" value={personaKey} onChange={v => setPersonaKey(v as InterviewPersonaKey)} options={Object.keys(interviewerPersonas)} /><SelectField label="Difficulty" value={difficulty} onChange={setDifficulty} options={["Foundation", "Stretch", "Challenge"]} /><div className="sm:col-span-2 flex flex-wrap gap-2"><Button onClick={() => { setFormalStarted(true); timer.reset(); timer.setRunning(true); speak(formalPersona.opening); setEvents(e => [...e, `Formal interview opened: ${formalPersona.label}`, `Mode: ${interviewMode}`]) }}>Enter interview <ArrowRight /></Button><Button variant="outline" onClick={() => setPeerMode(v => !v)}>{peerMode ? "Peer interviewer on" : "Use peer interviewer"}</Button><Button variant="outline" onClick={() => setInterruptions(v => !v)}>{interruptions ? "Interruptions on" : "Interruptions off"}</Button></div></CardContent></Card><aside className="space-y-4"><Card><CardHeader><p className="eyebrow">5-minute warm-up</p><CardTitle className="font-serif text-xl">Think aloud before you start</CardTitle></CardHeader><CardContent className="space-y-3"><div className="prompt-card"><span>{warmupIndex+1}</span><p>{warmUps[track][warmupIndex % warmUps[track].length]}</p></div><Button variant="outline" onClick={() => setWarmupIndex(i => (i+1)%warmUps[track].length)}>Another warm-up</Button></CardContent></Card><Card><CardHeader><CardTitle className="font-serif text-xl">Realistic expectations</CardTitle></CardHeader><CardContent className="space-y-2 text-sm text-muted-foreground"><p>• Silence from an interviewer does not mean your answer is wrong.</p><p>• Changing your mind after new evidence is often a strength.</p><p>• In Realistic/No-hint modes, scaffolding is deliberately limited.</p><p>• Published examples are clearly labelled; confidential recalled questions are not used.</p></CardContent></Card></aside></section></>\n'
          s=s.replace(anchor,insert,1)

          rep('return <><PageIntro eyebrow="Adaptive interview tutor" title="A real conversation, with published examples built in." description="Use original adaptive practice or switch to the published archive. Oxford entries come from official tutor examples; Cambridge entries use official mock/example resources because real Cambridge interview questions are confidential."',
              'return <><PageIntro eyebrow="Formal academic interview" title={`${formalPersona.label} · ${course}`} description="A structured academic conversation that rewards visible reasoning, response to challenge and willingness to revise a view. The interface deliberately avoids pretending to reproduce any confidential live interview."', 'formal title')

          rep('<SelectField label="Interviewer" value={personality} onChange={v => setPersonality(v as Interviewer)} options={["Supportive tutor", "Socratic tutor", "Technical tutor", "Critical tutor"]} />',
              '<SelectField label="Interviewer" value={personaKey} onChange={v => setPersonaKey(v as InterviewPersonaKey)} options={Object.keys(interviewerPersonas)} />', 'persona selector')
          rep('<SelectField label="Pressure" value={pressure} onChange={v => setPressure(v as Pressure)} options={["Guided", "Normal", "Challenging", "Full Mock"]} />',
              '<SelectField label="Session" value={interviewMode} onChange={v => setInterviewMode(v as InterviewMode)} options={["Tutor", "Realistic", "No-hint", "Stress"]} />', 'mode selector')

          rep('<Badge variant="outline">{personality}</Badge><Badge variant="outline">Turn {turns.length + 1}</Badge>',
              '<Badge variant="outline">{formalPersona.label}</Badge><Badge variant="outline">Turn {turns.length + 1}</Badge><Badge variant="outline">Confidence {confidence}/5</Badge>', 'header badges')
          rep('<p className="text-xs font-semibold text-[var(--blue)]">Interviewer: {turn.prompt}</p><p className="line-clamp-2 text-sm text-muted-foreground">You: {turn.answer}</p>',
              '<p className="text-xs font-semibold text-[var(--blue)]">Interviewer: {turn.prompt}</p><p className="line-clamp-2 text-sm text-muted-foreground">Candidate: {turn.answer}</p>', 'conversation labels')
          rep('{pressure !== "Full Mock" && <Button variant="outline" onClick={useHint}><Lightbulb />Hint {Math.min(hintLevel + 1, 3)}/3</Button>}',
              '{!noHints && <Button variant="outline" onClick={useHint}><Lightbulb />Hint {Math.min(hintLevel + 1, 3)}/3</Button>}<Button variant="outline" onClick={mutateQuestion}><WandSparkles />Change one condition</Button>', 'hints mutation')
          rep('<span className="mb-2 block text-sm font-semibold">Your reasoning for this turn</span>', '<span className="mb-2 block text-sm font-semibold">Candidate response</span>', 'answer label')
          rep('<Button variant="outline" onClick={analyseAndChallenge} disabled={!answer.trim() || !!result}>Submit reasoning & get follow-up <WandSparkles /></Button><Button onClick={finish} disabled={(!answer.trim() && turns.length === 0) || !!result}>Finish & mark <Zap /></Button>',
              '<Button variant="outline" onClick={analyseAndChallenge} disabled={!answer.trim() || !!result}>Submit answer <WandSparkles /></Button><Button onClick={finish} disabled={(!answer.trim() && turns.length === 0) || !!result}>Conclude interview <Zap /></Button>', 'formal buttons')

          rep('<Card className="shadow-none"><CardHeader><CardTitle className="font-serif text-xl">Thinking moves</CardTitle>',
              '<Card className="shadow-none"><CardHeader><CardTitle className="font-serif text-xl">Interview controls</CardTitle><CardDescription>Rate confidence before seeing feedback. Calibration matters as much as confidence itself.</CardDescription></CardHeader><CardContent className="space-y-3"><SelectField label="Confidence" value={String(confidence)} onChange={v => setConfidence(Number(v))} options={["1","2","3","4","5"]} />{peerMode && <Alert><School /><AlertTitle>Peer interviewer mode</AlertTitle><AlertDescription>Ask the peer to use the displayed follow-ups, interrupt only to probe reasoning, and avoid supplying the answer.</AlertDescription></Alert>}{visualStimulus && <VisualStimulus track={track} seed={seed} />}<Button variant="outline" className="w-full" onClick={() => setVisualStimulus(v => !v)}>{visualStimulus ? "Hide generated stimulus" : "Generate graph/data stimulus"}</Button></CardContent></Card><Card className="shadow-none"><CardHeader><CardTitle className="font-serif text-xl">Thinking moves</CardTitle>', 'interview controls')

          rep('function Feedback({ result, next }:', 'function VisualStimulus({ track, seed }: { track: TrackId; seed: number }) { const values=[18+seed%7,32+(seed*3)%13,27+(seed*5)%11,45+(seed*7)%9]; return <div className="rounded-xl border bg-white p-3"><p className="mb-2 text-xs font-bold uppercase tracking-wider text-muted-foreground">Generated unfamiliar stimulus</p><svg viewBox="0 0 240 120" className="w-full" role="img" aria-label="Generated line graph"><line x1="25" y1="8" x2="25" y2="100" stroke="currentColor"/><line x1="25" y1="100" x2="230" y2="100" stroke="currentColor"/><polyline fill="none" stroke="currentColor" strokeWidth="3" points={values.map((v,i)=>`${35+i*58},${100-v*1.5}`).join(" ")} />{values.map((v,i)=><circle key={i} cx={35+i*58} cy={100-v*1.5} r="4" fill="currentColor"/> )}</svg><p className="mt-2 text-xs text-muted-foreground">Treat this as unseen evidence: describe the pattern before explaining it. Track: {track}.</p></div> }\nfunction Feedback({ result, next }:', 'visual stimulus component')

          rep('function AdmissionsTests({ track, progress, accessibility, onResult, onToggleBookmark }:', 'function AdmissionsTests({ track, progress, setProgress, accessibility, onResult, onToggleBookmark }:', 'test signature name')
          rep('{ track: TrackId; progress: ProgressState; accessibility: AccessibilitySettings;', '{ track: TrackId; progress: ProgressState; setProgress: React.Dispatch<React.SetStateAction<ProgressState>>; accessibility: AccessibilitySettings;', 'test signature type')
          rep('useState<"Diagnostic" | "Adaptive" | "Question bank" | "All questions" | "Redo mistakes" | "Spaced review" | "Bookmarks" | "Teach me" | "Full mock" | "Full papers">("Diagnostic")',
              'useState<"Diagnostic" | "Adaptive" | "Question bank" | "All questions" | "Redo mistakes" | "Spaced review" | "Bookmarks" | "Teach me" | "Mini paper" | "Hard notebook" | "Full mock" | "Full papers">("Diagnostic")', 'test mode union')
          rep('[questionSearch, setQuestionSearch] = useState(""), [sectionStarted, setSectionStarted] = useState(false)',
              '[questionSearch, setQuestionSearch] = useState(""), [sectionStarted, setSectionStarted] = useState(false), [miniMinutes, setMiniMinutes] = useState(20), [hardReason, setHardReason] = useState(""), [hardLesson, setHardLesson] = useState("")', 'test states')
          rep('const spacedQuestions = useMemo(() => bankForTest.filter(q => progress.reattemptDue[q.id] && progress.reattemptDue[q.id] <= Date.now()), [bankForTest, progress.reattemptDue])',
              'const spacedQuestions = useMemo(() => bankForTest.filter(q => progress.reattemptDue[q.id] && progress.reattemptDue[q.id] <= Date.now()), [bankForTest, progress.reattemptDue])\n  const miniQuestions = useMemo(() => { const count=Math.max(6,Math.round(miniMinutes*.75)); return Array.from({length:Math.min(count,bankForTest.length)},(_,i)=>bankForTest[(i*17+progress.testAttempted+miniMinutes)%Math.max(bankForTest.length,1)]).filter((q,i,a)=>q&&a.findIndex(x=>x.id===q.id)===i) }, [bankForTest, miniMinutes, progress.testAttempted])\n  const hardQuestions = useMemo(() => bankForTest.filter(q => progress.bookmarkedQuestionIds.includes(q.id) || progress.wrongQuestionIds.includes(q.id) || progress.hardQuestionNotes.some(n => n.id===q.id)), [bankForTest, progress.bookmarkedQuestionIds, progress.wrongQuestionIds, progress.hardQuestionNotes])', 'test derived')
          rep('const practicePool = mode === "Redo mistakes" ? (redoQuestions.length ? redoQuestions : filteredPractice) : mode === "Spaced review" ? (spacedQuestions.length ? spacedQuestions : filteredPractice) : mode === "Bookmarks" ? (bookmarkedQuestions.length ? bookmarkedQuestions : filteredPractice) : filteredPractice',
              'const practicePool = mode === "Redo mistakes" ? (redoQuestions.length ? redoQuestions : filteredPractice) : mode === "Spaced review" ? (spacedQuestions.length ? spacedQuestions : filteredPractice) : mode === "Bookmarks" ? (bookmarkedQuestions.length ? bookmarkedQuestions : filteredPractice) : mode === "Mini paper" ? (miniQuestions.length ? miniQuestions : filteredPractice) : mode === "Hard notebook" ? (hardQuestions.length ? hardQuestions : filteredPractice) : filteredPractice', 'test pool')
          rep('const lesson = teachingLessonFor(test)', 'const lesson = teachingLessonFor(test), miniTimer = useTimer(miniMinutes)', 'mini timer')
          rep('const openBankQuestion = (id: string) => { const pos = filteredPractice.findIndex(q => q.id === id); setMode("Question bank"); setIndex(pos >= 0 ? pos : 0); setSelected(null); setChecked(false) }',
              'const openBankQuestion = (id: string) => { const pos = filteredPractice.findIndex(q => q.id === id); setMode("Question bank"); setIndex(pos >= 0 ? pos : 0); setSelected(null); setChecked(false) }\n  const saveHardNote = () => { if (!question) return; setProgress(p => ({ ...p, hardQuestionNotes: [...p.hardQuestionNotes.filter(n => n.id !== question.id), { id: question.id, reason: hardReason.trim(), lesson: hardLesson.trim(), updated: new Date().toISOString() }] })); if (!progress.bookmarkedQuestionIds.includes(question.id)) onToggleBookmark(question.id) }', 'hard note function')
          rep('{["Diagnostic", "Adaptive", "Question bank", "All questions", "Redo mistakes", "Spaced review", "Bookmarks", "Teach me", "Full mock", "Full papers"].map',
              '{["Diagnostic", "Adaptive", "Question bank", "All questions", "Redo mistakes", "Spaced review", "Bookmarks", "Teach me", "Mini paper", "Hard notebook", "Full mock", "Full papers"].map', 'mode options')

          rep('<Card className="mb-5 shadow-none"><CardContent className="grid gap-3 p-4 sm:grid-cols-2 xl:grid-cols-6">', '<Card className="mb-5 shadow-none"><CardContent className="grid gap-3 p-4 sm:grid-cols-2 xl:grid-cols-6">', 'keep filter anchor')
          # Inject mini-paper controls before main question grid
          marker='    {mode === "Diagnostic" && progress.testAttempted === 0 && <Alert className="mb-5 border-[var(--blue)]/20 bg-[var(--ice)]">'
          if marker not in s: raise SystemExit('missing test alert marker')
          extra='    {mode === "Mini paper" && <Card className="mb-5 border-[var(--blue)]/20 bg-[var(--ice)]"><CardHeader><div className="flex flex-wrap items-center justify-between gap-3"><div><p className="eyebrow">Generated mini-paper</p><CardTitle className="font-serif text-2xl">Targeted timed practice</CardTitle><CardDescription>Use shorter papers between full mocks. The set is drawn from the current test bank and keeps answers hidden until you check each item.</CardDescription></div><div className="timer"><Clock3 /><span>{formatTime(miniTimer.seconds)}</span><button onClick={() => miniTimer.setRunning(!miniTimer.running)}>{miniTimer.running ? "Pause" : "Start"}</button></div></div></CardHeader><CardContent className="flex flex-wrap gap-2">{testStrategies[test].miniMinutes.map(m => <Button key={m} variant={miniMinutes===m ? "default" : "outline"} onClick={() => { setMiniMinutes(m); miniTimer.reset(); setIndex(0) }}>{m} min</Button>)}<Badge variant="outline">{miniQuestions.length} questions</Badge></CardContent></Card>}{mode === "Hard notebook" && <Card className="mb-5"><CardHeader><p className="eyebrow">Hard-question notebook</p><CardTitle className="font-serif text-2xl">Record why this question was difficult</CardTitle><CardDescription>Turn a flag into a reusable learning note instead of simply marking the item wrong.</CardDescription></CardHeader><CardContent className="grid gap-3 md:grid-cols-2"><Textarea value={hardReason} onChange={e=>setHardReason(e.target.value)} rows={4} placeholder="Why did I get stuck? Misread? Missing concept? Wrong strategy?"/><Textarea value={hardLesson} onChange={e=>setHardLesson(e.target.value)} rows={4} placeholder="What will I do differently next time?"/><Button className="md:col-span-2" onClick={saveHardNote}>Save notebook entry</Button></CardContent></Card>}{marker}'
          s=s.replace(marker,extra,1)

          rep('<CardTitle className="font-serif text-2xl">Current official-style structure</CardTitle><CardDescription>{blueprint.note}</CardDescription>',
              '<CardTitle className="font-serif text-2xl">Current official-style structure</CardTitle><CardDescription>{blueprint.note}</CardDescription><div className="mt-3 flex flex-wrap gap-2">{testStrategies[test].focus.map(item => <Badge variant="outline" key={item}>{item}</Badge>)}</div>', 'test focus')

          # Application research project
          marker='function ApplicationLab({ track, progress, setProgress }:'
          if marker not in s: raise SystemExit('missing application function')
          # inject a new card before closing section via known reading tutor card
          readmark='<Card className="xl:col-span-2"><CardHeader><p className="eyebrow">Subject reading tutor</p>'
          if readmark not in s: raise SystemExit('missing reading tutor')
          research='<Card className="xl:col-span-2"><CardHeader><p className="eyebrow">Research project mode</p><CardTitle className="font-serif text-2xl">Build an idea worth defending over several weeks.</CardTitle><CardDescription>Keep a live question, evidence, counterargument and next investigation. This becomes interview material rather than a list of activities.</CardDescription></CardHeader><CardContent className="grid gap-3 md:grid-cols-2"><Textarea value={progress.researchProject.question} onChange={e=>setProgress(p=>({...p,researchProject:{...p.researchProject,question:e.target.value}}))} placeholder="Research question"/><Textarea value={progress.researchProject.evidence} onChange={e=>setProgress(p=>({...p,researchProject:{...p.researchProject,evidence:e.target.value}}))} placeholder="Best evidence or argument so far"/><Textarea value={progress.researchProject.counter} onChange={e=>setProgress(p=>({...p,researchProject:{...p.researchProject,counter:e.target.value}}))} placeholder="Strongest counterargument / limitation"/><Textarea value={progress.researchProject.next} onChange={e=>setProgress(p=>({...p,researchProject:{...p.researchProject,next:e.target.value}}))} placeholder="What will I investigate next?"/></CardContent></Card><Card className="xl:col-span-2"><CardHeader><p className="eyebrow">Supercurricular defence bank</p><CardTitle className="font-serif text-2xl">Be able to defend what you actually learned.</CardTitle></CardHeader><CardContent className="grid gap-3 md:grid-cols-2">{progress.activities.length ? progress.activities.map((a,i)=><div className="rounded-xl border p-4" key={`${a.title}-${i}`}><strong>{a.title}</strong><p className="mt-2 text-sm text-muted-foreground">What did you disagree with? Which evidence was weakest? How did this change your view? What would you read or test next?</p></div>) : <p className="text-sm text-muted-foreground">Add genuine academic activities above; each becomes a defence prompt here.</p>}</CardContent></Card>'
          s=s.replace(readmark,research+readmark,1)

          # Planner: add official library/privacy/completeness before weekly workload
          weekly='<Card className="xl:col-span-2"><CardHeader><CardTitle className="font-serif text-2xl">Automatic weekly workload</CardTitle>'
          if weekly not in s: raise SystemExit('missing planner weekly')
          plannerextra='<Card className="xl:col-span-2"><CardHeader><p className="eyebrow">Application completeness</p><CardTitle className="font-serif text-2xl">Nothing important hidden in another tab</CardTitle></CardHeader><CardContent className="grid gap-2 sm:grid-cols-2">{[["Interview practice",progress.sessions>0],["Admissions test baseline",progress.testAttempted>=10],["Supercurricular reflection",progress.activities.length>0],["Technology rehearsal",tech.camera&&tech.mic],["Written/application defence",progress.logs.length>0],["Mentor tasks clear",progress.mentorAssignments.every(x=>x.done)]].map(([label,ok])=><div className="route-row" key={String(label)}><p>{String(label)}</p><Badge variant={ok ? "default" : "outline"}>{ok ? "Ready" : "To do"}</Badge></div>)}</CardContent></Card><Card className="xl:col-span-2"><CardHeader><p className="eyebrow">Official resource library</p><CardTitle className="font-serif text-2xl">Current guidance with freshness labels</CardTitle><CardDescription>Use these links to verify requirements before acting. Course and College arrangements can change.</CardDescription></CardHeader><CardContent className="grid gap-3 md:grid-cols-2">{officialResourceLibrary.map(item=><a className="rounded-xl border p-4 hover:bg-[var(--ice)]" href={item.url} target="_blank" rel="noreferrer" key={item.url}><div className="flex flex-wrap gap-2"><Badge>{item.university}</Badge><Badge variant="outline">{item.area}</Badge></div><strong className="mt-2 block">{item.title}</strong><small className="text-muted-foreground">Checked {item.checked}</small></a>)}</CardContent></Card><Card className="xl:col-span-2"><CardHeader><p className="eyebrow">Interview routing</p><CardTitle className="font-serif text-2xl">Prepare for different academic contexts</CardTitle></CardHeader><CardContent className="grid gap-3 md:grid-cols-2"><Alert><GraduationCap/><AlertTitle>Oxford</AlertTitle><AlertDescription>{interviewRoutingNotes.Oxford}</AlertDescription></Alert><Alert><School/><AlertTitle>Cambridge / College context</AlertTitle><AlertDescription>{interviewRoutingNotes.Cambridge}</AlertDescription></Alert></CardContent></Card><Card className="xl:col-span-2"><CardHeader><p className="eyebrow">Privacy, export & parent summary</p><CardTitle className="font-serif text-2xl">Student controls the preparation record</CardTitle><CardDescription>Progress remains browser-local unless a future school-approved backend is connected. Export gives the student a portable copy.</CardDescription></CardHeader><CardContent className="space-y-3"><div className="grid gap-2 sm:grid-cols-3">{[["saveTranscripts","Save interview transcripts"],["parentSummary","Allow high-level parent summary"],["localOnly","Keep data local-only"]].map(([key,label])=><button key={key} className={`plan-tile ${progress.privacy[key as keyof PrivacySettings] ? "complete" : ""}`} onClick={()=>setProgress(p=>({...p,privacy:{...p.privacy,[key]:!p.privacy[key as keyof PrivacySettings]}}))}><span>{progress.privacy[key as keyof PrivacySettings] ? <Check/> : "+"}</span><strong>{label}</strong></button>)}</div><div className="flex flex-wrap gap-2"><Button variant="outline" onClick={()=>{const blob=new Blob([JSON.stringify(progress,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="oxbridge-progress.json";a.click();URL.revokeObjectURL(url)}}><FileText/>Export progress</Button><Button variant="outline" onClick={()=>window.print()}><FileText/>Print/PDF portfolio</Button></div>{progress.privacy.parentSummary&&<Alert><CircleUserRound/><AlertTitle>Parent-safe summary</AlertTitle><AlertDescription>{progress.sessions} interview sessions · {progress.testAttempted} test questions · {progress.mentorAssignments.filter(x=>!x.done).length} mentor tasks outstanding. Private essays and transcripts are not shown here.</AlertDescription></Alert>}<p className="text-xs text-muted-foreground">Cross-device cloud accounts are not connected yet; export/import remains the safe fallback until a backend is approved.</p></CardContent></Card>'
          s=s.replace(weekly,plannerextra+weekly,1)

          # Teacher interview packs
          rep('[assignment, setAssignment] = useState(mentorAssignmentTemplates[0]), generated = generatedInterviewQuestion(track, difficulty, skill, seed)',
              '[assignment, setAssignment] = useState(mentorAssignmentTemplates[0]), [packTitle, setPackTitle] = useState("20-minute mock interview"), [packPrompts, setPackPrompts] = useState(""), generated = generatedInterviewQuestion(track, difficulty, skill, seed)', 'teacher states')
          rep('const addAssignment = () => { if (!assignment.trim()) return; setProgress(p => ({ ...p, mentorAssignments: [...p.mentorAssignments, { id: `${Date.now()}`, title: assignment.trim(), done: false }] })); }',
              'const addAssignment = () => { if (!assignment.trim()) return; setProgress(p => ({ ...p, mentorAssignments: [...p.mentorAssignments, { id: `${Date.now()}`, title: assignment.trim(), done: false }] })); }\n  const savePack = () => { const prompts=packPrompts.split("\\n").map(x=>x.trim()).filter(Boolean); if (!prompts.length) return; setProgress(p=>({...p,interviewPacks:[...p.interviewPacks,{id:`${Date.now()}`,title:packTitle.trim()||"Mock interview",prompts}]})); setPackPrompts("") }', 'teacher save pack')
          teacheranchor='<Card className="mt-5"><CardHeader><CardTitle className="font-serif text-2xl">Mentor assignment queue</CardTitle>'
          if teacheranchor not in s: raise SystemExit('missing teacher mentor card')
          teacherextra='<section className="mt-5 grid gap-5 xl:grid-cols-2"><Card><CardHeader><p className="eyebrow">School cohort dashboard</p><CardTitle className="font-serif text-2xl">Who needs attention?</CardTitle></CardHeader><CardContent className="space-y-2">{teacherStudents.map(student=><div className="route-row" key={student.name}><p>{student.name}<small className="block text-xs text-muted-foreground">{student.course}</small></p><strong>{student.interviews} interviews · {student.testAccuracy}%</strong></div>)}</CardContent></Card><Card><CardHeader><p className="eyebrow">Teacher-created interview pack</p><CardTitle className="font-serif text-2xl">Build a reusable mock</CardTitle></CardHeader><CardContent className="space-y-3"><input className="h-10 w-full rounded-md border px-3 text-sm" value={packTitle} onChange={e=>setPackTitle(e.target.value)} /><Textarea value={packPrompts} onChange={e=>setPackPrompts(e.target.value)} rows={7} placeholder="One prompt or follow-up per line…"/><Button onClick={savePack}>Save interview pack</Button>{progress.interviewPacks.map(pack=><div className="rounded-xl border p-3" key={pack.id}><strong>{pack.title}</strong><p className="text-xs text-muted-foreground">{pack.prompts.length} prompts</p></div>)}</CardContent></Card></section>'
          s=s.replace(teacheranchor,teacherextra+teacheranchor,1)

          # Progress confidence/misconception/milestone/weak answer clinic
          replay='<Card className="mt-5"><CardHeader><CardTitle className="font-serif text-2xl">Replay my interviews</CardTitle>'
          if replay not in s: raise SystemExit('missing progress replay')
          progress_extra='<section className="mt-5 grid gap-5 xl:grid-cols-2"><Card><CardHeader><p className="eyebrow">Confidence calibration</p><CardTitle className="font-serif text-2xl">Was confidence justified?</CardTitle></CardHeader><CardContent className="space-y-2">{progress.confidenceLogs.length ? progress.confidenceLogs.slice(-6).reverse().map((row,i)=><div className="route-row" key={`${row.date}-${i}`}><p>Confidence {row.confidence}/5<small className="block text-xs text-muted-foreground">{row.note}</small></p><strong>{row.score}/100</strong></div>) : <p className="text-sm text-muted-foreground">Rate confidence in a formal interview before feedback to build calibration data.</p>}</CardContent></Card><Card><CardHeader><p className="eyebrow">Misconception memory</p><CardTitle className="font-serif text-2xl">Patterns that keep returning</CardTitle></CardHeader><CardContent className="space-y-2">{Object.entries(progress.misconceptions).length ? Object.entries(progress.misconceptions).sort((a,b)=>b[1]-a[1]).map(([name,count])=><div className="route-row" key={name}><p>{name}<small className="block text-xs text-muted-foreground">{mistakeRemedies[name] ?? "Deliberately test this weakness in the next session."}</small></p><Badge variant="outline">{count}×</Badge></div>) : <p className="text-sm text-muted-foreground">No repeated interview misconception recorded yet.</p>}</CardContent></Card><Card><CardHeader><p className="eyebrow">Weak-answer clinic</p><CardTitle className="font-serif text-2xl">Diagnose the reasoning, not the wording</CardTitle></CardHeader><CardContent className="space-y-3">{weakAnswerClinic.map(item=><div className="rounded-xl border p-3" key={item.label}><strong>{item.label}</strong><p className="mt-1 text-sm italic text-muted-foreground">“{item.example}”</p><p className="mt-2 text-sm">{item.diagnosis}</p><p className="mt-1 text-xs text-[var(--blue)]">Fix: {item.fix}</p></div>)}</CardContent></Card><Card><CardHeader><p className="eyebrow">Milestones</p><CardTitle className="font-serif text-2xl">Evidence of sustained preparation</CardTitle></CardHeader><CardContent className="space-y-2">{coachMilestones.map((item,i)=>{const states=milestoneStatus({sessions:progress.sessions,testAttempted:progress.testAttempted,activities:progress.activities.length,completed:progress.completed,wrongQuestionIds:progress.wrongQuestionIds,logs:progress.logs});return <div className="route-row" key={item.id}><p>{item.label}</p><Badge variant={states[i]?"default":"outline"}>{states[i]?"Reached":"In progress"}</Badge></div>})}</CardContent></Card></section>'
          s=s.replace(replay,progress_extra+replay,1)

          p.write_text(s)

          # Add a small formal-interview visual treatment.
          css=Path('app/globals.css')
          c=css.read_text()
          if '.formal-interview' not in c:
              c+='''\n\n.formal-interview { background: linear-gradient(180deg, rgba(15,23,42,.04), transparent 16rem); }\n.interview-room-card { border-color: rgba(30,64,175,.18); box-shadow: 0 18px 45px rgba(15,23,42,.08); }\n@media (max-width: 640px) { .interview-room-card textarea { min-height: 14rem; } }\n'''
          css.write_text(c)
          PY
      - name: Commit integrated upgrade
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/globals.css
          git commit -m "Integrate formal interview and personal coach features"
          git push origin HEAD:feat/ideal-oxbridge-coach
