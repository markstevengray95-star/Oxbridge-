name: Fix coach JSX marker
on:
  push:
    branches: [feat/ideal-oxbridge-coach]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ideal-oxbridge-coach
      - name: Fix malformed diagnostic JSX marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='{marker}<Target /><AlertTitle>Start with a diagnostic</AlertTitle><AlertDescription>Complete at least five mixed questions. The app records knowledge, logic, reading and time-management patterns, then your redo queue keeps missed questions active until they are secured.</AlertDescription></Alert>}'
          new='{mode === "Diagnostic" && progress.testAttempted === 0 && <Alert className="mb-5 border-[var(--blue)]/20 bg-[var(--ice)]"><Target /><AlertTitle>Start with a diagnostic</AlertTitle><AlertDescription>Complete at least five mixed questions. The app records knowledge, logic, reading and time-management patterns, then your redo queue keeps missed questions active until they are secured.</AlertDescription></Alert>}'
          if old not in s:
              raise SystemExit('diagnostic marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx
          git commit -m "Fix admissions test coach JSX"
          git push origin HEAD:feat/ideal-oxbridge-coach
