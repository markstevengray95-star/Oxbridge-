name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Regenerate dependency lock metadata
        run: npm install --package-lock-only --legacy-peer-deps

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Verify clean locked install
        run: npm ci --legacy-peer-deps

      - name: Report all dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Block high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
