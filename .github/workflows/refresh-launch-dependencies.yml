name: Refresh launch dependency lockfile

on:
  push:
    branches:
      - launch-hardening-20261003

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-hardening-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Refresh security-patched dependencies and lockfile
        run: |
          npm install --legacy-peer-deps --save-exact next@16.3.8 eslint-config-next@16.3.8 vinext@1.0.0
          npm install --legacy-peer-deps --save-dev --save-exact @cloudflare/vite-plugin@1.62.5 wrangler@4.146.0
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch launch dependency vulnerabilities"
          git push origin HEAD:launch-hardening-20261003
