name: Verify app

on:
  pull_request:
  push:
    branches: [main, feature/harder-authentic-question-bank-v2, integration/harder-authentic-current-main, feature/mobile-mode-navigation-cleanup, fix/non-admin-ai-access, feature/practice-tracking-dashboard, feature/digital-twin-written-defence-replay, feature/classroom-mockday-mistakes-deadlines, feature/phase-two-prep-upgrades, hardening/end-to-end-journey-integrity]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Mobile navigation regression checks
        run: node tests/mobile-navigation.cjs

      - name: Non-admin AI access regression checks
        run: node tests/non-admin-ai-access.cjs

      - name: Cloud sync regression checks
        run: node tests/cloud-sync-config.cjs

      - name: End-to-end hardening checks
        run: node tests/end-to-end-hardening.cjs

      - name: Private history persistence checks
        run: node tests/user-history-persistence.cjs

      - name: Managed practice tracking checks
        run: node tests/admin-practice-tracking.cjs

      - name: Digital Twin, defence and replay checks
        run: node tests/digital-twin-defence-replay.cjs

      - name: Classroom, Mock Day, mistake and deadline checks
        run: node tests/connected-prep-phase-two.cjs

      - name: Next-phase preparation upgrade checks
        run: node tests/phase-two-prep-upgrades.cjs

      - name: Tutor command centre integration checks
        run: node tests/tutor-command-centre.cjs

      - name: Tutor evidence-confidence behaviour checks
        run: node tests/tutor-evidence-quality.mjs

      - name: Interview answer-quality behaviour checks
        run: node tests/interview-answer-quality.mjs

      - name: Realistic interview and typed marking checks
        run: node tests/interview-realism-marking-v3.mjs

      - name: Adaptive interview questioning checks
        run: node tests/interview-questioning-engine.mjs

      - name: Deep interview behaviour checks
        run: node tests/interview-depth-features.mjs

      - name: Complete exam and interview intelligence checks
        run: node tests/complete-exam-interview-intelligence.mjs

      - name: Learning trajectory and progression checks
        run: node tests/learning-trajectory-progression.mjs

      - name: Offline topic-alignment regression checks
        run: node tests/offline-topic-alignment.cjs

      - name: Offline task-aware essay regression checks
        run: node tests/offline-analysis-v3.cjs

      - name: Strict essay grading regression checks
        run: node tests/strict-essay-score.cjs

      - name: Essay AI availability regression checks
        run: node tests/essay-ai-availability.cjs

      - name: Full paper uniqueness checks
        run: node tests/full-paper-uniqueness.mjs

      - name: Question reliability checks
        run: node tests/question-reliability.mjs

      - name: Answer-pattern authenticity checks
        run: node tests/answer-pattern-authenticity.mjs

      - name: Upgraded question bank checks
        run: node tests/reliability-upgrade-bank.mjs

      - name: Full paper form-separation checks
        run: node tests/full-paper-form-separation.mjs

      - name: Paper assembly integrity checks
        run: node tests/paper-assembly-integrity.mjs

      - name: TMUA specification breadth checks
        run: node tests/tmua-topic-coverage.mjs

      - name: ESAT specification breadth checks
        run: node tests/esat-topic-coverage.mjs

      - name: TARA five-option and reasoning coverage checks
        run: node tests/tara-format-coverage.mjs

      - name: UCAT SJT response-format checks
        run: node tests/ucat-sjt-format.mjs

      - name: UCAT calculator integration checks
        run: node tests/ucat-calculator.cjs

      - name: UCAT verbal reasoning format checks
        run: node tests/ucat-vr-format.mjs

      - name: UCAT decision-making family checks
        run: node tests/ucat-dm-format.mjs

      - name: UCAT quantitative-reasoning data checks
        run: node tests/ucat-qr-format.mjs

      - name: Type-aware production build
        run: npm run build
