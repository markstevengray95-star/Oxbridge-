name: Verify app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cloud sync regression checks
        run: node tests/cloud-sync-config.cjs

      - name: Offline topic-alignment regression checks
        run: node tests/offline-topic-alignment.cjs

      - name: Type-aware production build
        run: npm run build
