name: Verify app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-aware production build
        run: pnpm build
