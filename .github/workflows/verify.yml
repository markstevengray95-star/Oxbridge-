name: Verify app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies and refresh lockfile
        run: npm install --legacy-peer-deps

      - name: Dependency audit detail
        run: |
          npm audit --json > audit.json || true
          cat audit.json

      - name: Type-aware production build
        run: npm run build

      - name: Commit refreshed lockfile on audit branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh lockfile for security updates"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
