name: Verify app

on:
  pull_request:
  push:
    branches: [main, feature/harder-authentic-question-bank-v2, integration/harder-authentic-current-main, feature/mobile-mode-navigation-cleanup]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: All regression checks
        run: npm test

      - name: Type-aware production build
        run: npm run build
